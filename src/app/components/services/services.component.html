<section class="py-8 px-4 sm:px-6 lg:px-8 bg-gray-50 dark:bg-gray-800" id="services">
  <div class="max-w-6xl mx-auto">
    <h2 class="text-2xl md:text-3xl font-bold text-gray-900 dark:text-white text-center mb-8">
      {{ 'SERVICES.TITLE' | translate }}
    </h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div *ngFor="let service of services" class="w-full border border-gray-100 rounded-lg shadow-sm hover:shadow-md transition-shadow duration-200 min-w-0 service-card">
        <a [routerLink]="['/services', service.id]" [attr.aria-label]="'SERVICES.LEARN_MORE' | translate:{ title: (service.title | translate) }" class="block">
          <img class="rounded-t-lg w-full h-36 object-cover" [src]="service.image" [alt]="service.title | translate" />
        </a>
        <div class="p-3 h-36 flex flex-col justify-between">
          <div>
            <a [routerLink]="['/services', service.id]">
              <h5 class="mb-1 text-base font-semibold tracking-tight text-gray-900 dark:text-white truncate">
                {{ service.title | translate }}
              </h5>
            </a>
            <p class="mb-2 text-xs text-gray-600 dark:text-gray-300 text-wrap">
              {{ service.description | translate }}
            </p>
          </div>
          <a [routerLink]="['/services', service.id]" class="inline-flex items-center px-2 py-1 text-xs font-medium text-blue-600 dark:text-blue-400 rounded-md hover:text-blue-800 dark:hover:text-blue-300 focus:ring-2 focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-700 transition-colors duration-200" [attr.aria-label]="'SERVICES.READ_MORE_ARIA' | translate:{ title: (service.title | translate) }">
            {{ 'SERVICES.READ_MORE' | translate }}
            <svg class="rtl:rotate-180 w-3 h-3 ml-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"/>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
