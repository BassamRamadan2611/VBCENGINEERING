<section class="relative bg-gradient-to-b from-gray-100 to-white py-12 md:py-16 lg:py-20 overflow-hidden" id="about-us">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Side-by-Side Content -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 md:gap-8 lg:gap-12 items-center">
      <!-- Text Content -->
      <div class="animate-fade-in-up">
        <h2 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-extrabold text-gray-900 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 mb-6">
          {{ 'ABOUT.TITLE' | translate }}
        </h2>
        <p class="text-base sm:text-lg md:text-xl lg:text-2xl text-gray-600 leading-relaxed">
          {{ 'ABOUT.DESCRIPTION' | translate }}
        </p>
        <div class="mt-6 flex flex-col sm:flex-row gap-4">
          <a href="/about-details" 
             class="inline-flex items-center justify-center bg-indigo-600 text-white font-semibold px-6 py-3 sm:px-8 sm:py-4 rounded-full hover:bg-indigo-700 transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 text-sm sm:text-base"
             (click)="gotoAboutDetails()">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
            </svg>
            {{ 'ABOUT.READ_MORE' | translate }}
          </a>
        </div>
      </div>
      <!-- Image Section -->
      <div class="relative">
        <div class="relative w-full max-w-sm mx-auto lg:mx-0 rounded-xl overflow-hidden shadow-xl transform hover:scale-[1.02] transition-transform duration-500">
          <img src="assets/images/slider4.webp" alt="VBC Project Showcase" class="w-full h-48 sm:h-56 md:h-64 object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
        </div>
      </div>
    </div>
  </div>
  <!-- Background Decorative Element -->
  <div class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-hidden">
    <div class="absolute -top-40 -left-40 w-80 h-80 bg-indigo-200 opacity-20 rounded-full filter blur-3xl animate-pulse"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-purple-200 opacity-20 rounded-full filter blur-3xl animate-pulse delay-1000"></div>
  </div>
</section>
