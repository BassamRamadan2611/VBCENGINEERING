<div class="max-w-lg mx-auto p-6 bg-gradient-to-br from-white to-gray-50 shadow-xl rounded-xl mt-12 transform transition-all hover:scale-[1.01]">
  <h2 class="text-3xl font-extrabold text-gray-900 mb-8 text-center">{{ 'CONTACT_FORM.TITLE' | translate }}</h2>
  <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="space-y-6">
    <!-- Name Field -->
    <div class="relative">
      <label for="name" class="absolute -top-2 left-2 inline-block bg-white px-1 text-xs font-medium text-gray-600 transform transition-all duration-300">{{ 'CONTACT_FORM.NAME_LABEL' | translate }}</label>
      <div class="mt-1 flex items-center">
        <svg class="w-5 h-5 text-gray-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="formData.name"
          required
          class="block w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
          [placeholder]="'CONTACT_FORM.NAME_PLACEHOLDER' | translate"
        />
      </div>
    </div>

    <!-- Phone Field -->
    <div class="relative">
      <label for="phone" class="absolute -top-2 left-2 inline-block bg-white px-1 text-xs font-medium text-gray-600 transform transition-all duration-300">{{ 'CONTACT_FORM.PHONE_LABEL' | translate }}</label>
      <div class="mt-1 flex items-center">
        <svg class="w-5 h-5 text-gray-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
        </svg>
        <input
          type="tel"
          id="phone"
          name="phone"
          [(ngModel)]="formData.phone"
          required
          class="block w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
          [placeholder]="'CONTACT_FORM.PHONE_PLACEHOLDER' | translate"
        />
      </div>
    </div>

    <!-- Message Field -->
    <div class="relative">
      <label for="message" class="absolute -top-2 left-2 inline-block bg-white px-1 text-xs font-medium text-gray-600 transform transition-all duration-300">{{ 'CONTACT_FORM.MESSAGE_LABEL' | translate }}</label>
      <div class="mt-1 flex items-start">
        <svg class="w-5 h-5 text-gray-400 mr-2 mt-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path>
        </svg>
        <textarea
          id="message"
          name="message"
          [(ngModel)]="formData.message"
          required
          rows="5"
          class="block w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
          [placeholder]="'CONTACT_FORM.MESSAGE_PLACEHOLDER' | translate"
        ></textarea>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="text-center">
      <button
        type="submit"
        class="inline-flex items-center bg-indigo-600 text-white px-8 py-3 rounded-lg hover:bg-indigo-700 transition-all duration-300 transform hover:scale-105 disabled:bg-gray-400 disabled:cursor-not-allowed"
        [disabled]="isSubmitting"
      >
        <span *ngIf="isSubmitting" class="loader mr-2"></span>
        {{ isSubmitting ? ('CONTACT_FORM.SUBMITTING_BUTTON' | translate) : ('CONTACT_FORM.SUBMIT_BUTTON' | translate) }}
      </button>
    </div>
  </form>
</div>
