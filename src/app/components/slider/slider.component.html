<div id="default-carousel" class="relative w-full" data-carousel="slide">
    <!-- Carousel wrapper -->
    <div class="relative h-[100vh] overflow-hidden rounded-lg">
        <!-- Slide 1 -->
        <div class="hidden duration-700 ease-in-out" data-carousel-item>
            <div class="relative w-full h-full">
                <img src="assets/images/1.png" 
                     class="block w-full h-full object-cover" 
                     alt="Slide 1">
                <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-40">
                </div>
            </div>
        </div>
        <!-- Slide 2 -->
        <div class="hidden duration-700 ease-in-out" data-carousel-item>
            <div class="relative w-full h-full">
                <img src="assets/images/2.webp" 
                     class="block w-full h-full object-cover" 
                     alt="Slide 2">
                <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-40">
                </div>
            </div>
        </div>
        <!-- Slide 3 -->
        <div class="hidden duration-700 ease-in-out" data-carousel-item>
            <div class="relative w-full h-full">
                <img src="assets/images/3.webp" 
                     class="block w-full h-full object-cover" 
                     alt="Slide 3">
                <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-40">
                </div>
            </div>
        </div>
        <!-- Slide 4 -->
        <div class="hidden duration-700 ease-in-out" data-carousel-item>
            <div class="relative w-full h-full">
                <img src="assets/images/4.jpg" 
                     class="block w-full h-full object-cover" 
                     alt="Slide 4">
                <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-40">
                </div>
            </div>
        </div>
        <!-- Slide 5 -->
        <div class="hidden duration-700 ease-in-out" data-carousel-item>
            <div class="relative w-full h-full">
                <img src="assets/images/5.webp" 
                     class="block w-full h-full object-cover" 
                     alt="Slide 5">
                <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-40">
                </div>
            </div>
        </div>
    </div>
    <!-- Carousel indicators -->
    <div class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3 rtl:space-x-reverse">
        <button type="button" class="w-3 h-3 rounded-full bg-white opacity-50 hover:opacity-100" aria-current="true" aria-label="Slide 1" data-carousel-slide-to="0"></button>
        <button type="button" class="w-3 h-3 rounded-full bg-white opacity-50 hover:opacity-100" aria-current="false" aria-label="Slide 2" data-carousel-slide-to="1"></button>
        <button type="button" class="w-3 h-3 rounded-full bg-white opacity-50 hover:opacity-100" aria-current="false" aria-label="Slide 3" data-carousel-slide-to="2"></button>
        <button type="button" class="w-3 h off-white p-4" aria-current="false" aria-label="Slide 4" data-carousel-slide-to="3"></button>
        <button type="button" class="w-3 h-3 rounded-full bg-white opacity-50 hover:opacity-100" aria-current="false" aria-label="Slide 5" data-carousel-slide-to="4"></button>
    </div>
    <!-- Carousel controls -->
    <button type="button" class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" data-carousel-prev>
        <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
            <svg class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 1 1 5l4 4"/>
            </svg>
            <span class="sr-only">Previous</span>
        </span>
    </button>
    <button type="button" class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" data-carousel-next>
        <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
            <svg class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
            </svg>
            <span class="sr-only">Next</span>
        </span>
    </button>
</div>
